name: BALAM - Validar mapa multi-capas
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/validate-map.cjs'
      - 'scripts/import_denue_sonora.py'
      - 'scripts/test_denue_import.py'
      - 'scripts/build_road_support_sonora.py'
      - 'scripts/test_road_support_sonora.py'
      - 'data/road-services/**'
      - 'data/denue/**'
      - 'data/capufe/**'
      - 'data/health/**'
      - 'data/smn/**'
      - '.github/workflows/qa-map.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-map.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_denue_import.py
      - run: python scripts/test_road_support_sonora.py
