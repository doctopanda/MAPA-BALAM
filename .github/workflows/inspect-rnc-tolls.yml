name: BALAM - Inspeccionar geodatos plazas RNC INEGI
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_rnc_tolls.py'
      - '.github/workflows/inspect-rnc-tolls.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_rnc_tolls.py
